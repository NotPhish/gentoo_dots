# reload config
bind=SUPER,r,reload_config

# menu and terminal
bind=Alt,space,spawn,wofi --show drun
bind=Alt,Return,spawn,alacritty

# exit
bind=SUPER,m,quit
bind=ALT,q,killclient,

# switch window focus
bind=ALT,Left,focusdir,left
bind=ALT,Right,focusdir,right
bind=ALT,Up,focusdir,up
bind=ALT,Down,focusdir,down

bind=ALT+SHIFT,Left,move_client,left
bind=ALT+SHIFT,Right,move_client,right
bind=ALT+SHIFT,Up,move_client,up
bind=ALT+SHIFT,Down,move_client,down

bind=ALT+SHIFT,space,togglefloating,


bind=NONE,Print,spawn_shell,f=$(mktemp -t screenshot-XXXXXX.png) && grim "$f" && wl-copy < "$f" && rm -f "$f"

